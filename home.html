<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Globe Trotter - Smart Travel Planner</title>
  <!-- Tailwind CSS via CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Chart.js for Budget Breakdown -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="bg-slate-50 text-slate-900 font-sans min-h-screen">

  <!-- Navbar -->
  <header class="bg-white border-b border-slate-200 sticky top-0 z-50">
    <div class="max-w-6xl mx-auto px-4 h-16 flex items-center justify-between">
      <div class="flex items-center space-x-2">
        <span class="text-2xl">✈️</span>
        <span class="text-xl font-black text-indigo-600 tracking-tight">GlobeTrotter</span>
      </div>
      <div class="flex items-center gap-3">
        <button onclick="switchView('dashboard')" class="text-sm font-semibold text-slate-600 hover:text-indigo-600 px-3 py-1.5 rounded-lg">My Trips</button>
        <button onclick="openModal('createTripModal')" class="bg-indigo-600 hover:bg-indigo-700 text-white text-sm font-medium px-4 py-2 rounded-lg shadow-sm transition">
          + Plan New Trip
        </button>
      </div>
    </div>
  </header>

  <main class="max-w-6xl mx-auto px-4 py-8">
    
    <!-- VIEW 1: DASHBOARD / MY TRIPS -->
    <section id="dashboardView">
      <div class="flex justify-between items-center mb-6">
        <div>
          <h1 class="text-2xl font-bold text-slate-800">Your Trips</h1>
          <p class="text-sm text-slate-500">Manage your upcoming journeys and explore itineraries.</p>
        </div>
      </div>
      <div id="tripsGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
        <!-- Rendered via JavaScript -->
      </div>
    </section>

    <!-- VIEW 2: ITINERARY BUILDER & BUDGET -->
    <section id="tripDetailView" class="hidden">
      <button onclick="switchView('dashboard')" class="mb-4 text-sm font-medium text-slate-500 hover:text-slate-800 flex items-center gap-1">
        ← Back to Trips
      </button>

      <div class="bg-white border border-slate-200 rounded-2xl p-6 mb-6 shadow-sm flex flex-col md:flex-row md:items-center justify-between gap-4">
        <div>
          <h1 id="activeTripTitle" class="text-3xl font-extrabold text-slate-900">Trip Name</h1>
          <p id="activeTripDates" class="text-sm text-indigo-600 font-medium mt-1">Dates</p>
          <p id="activeTripDesc" class="text-sm text-slate-600 mt-2 max-w-xl"></p>
        </div>
        <div class="flex gap-2">
          <button onclick="openModal('addStopModal')" class="bg-indigo-50 border border-indigo-200 text-indigo-700 hover:bg-indigo-100 text-sm font-semibold px-4 py-2 rounded-lg">
            + Add Destination Stop
          </button>
        </div>
      </div>

      <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
        <!-- Itinerary Stops List (Left 2 Columns) -->
        <div class="lg:col-span-2 space-y-6" id="stopsContainer">
          <!-- Rendered via JavaScript -->
        </div>

        <!-- Budget Summary (Right 1 Column) -->
        <div class="bg-white border border-slate-200 rounded-2xl p-6 shadow-sm h-fit sticky top-24">
          <h3 class="text-lg font-bold text-slate-800 mb-1">Budget Breakdown</h3>
          <p class="text-3xl font-black text-indigo-600 mb-4" id="totalCostDisplay">$0.00</p>
          <div class="h-60 flex items-center justify-center">
            <canvas id="budgetChart"></canvas>
          </div>
        </div>
      </div>
    </section>

  </main>

  <!-- MODAL: CREATE TRIP -->
  <div id="createTripModal" class="fixed inset-0 bg-slate-900/40 backdrop-blur-sm hidden items-center justify-center p-4 z-50">
    <div class="bg-white rounded-2xl max-w-md w-full p-6 shadow-xl">
      <h3 class="text-xl font-bold text-slate-800 mb-4">Plan a New Trip</h3>
      <form onsubmit="handleCreateTrip(event)" class="space-y-4">
        <div>
          <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Trip Name</label>
          <input id="newTripName" required placeholder="e.g. Euro Summer Tour" class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-indigo-500 outline-none" />
        </div>
        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Start Date</label>
            <input type="date" id="newTripStart" required class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-indigo-500 outline-none" />
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">End Date</label>
            <input type="date" id="newTripEnd" required class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-indigo-500 outline-none" />
          </div>
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Cover Image URL</label>
          <input id="newTripImage" placeholder="https://images.unsplash.com/..." class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-indigo-500 outline-none" />
        </div>
        <div class="flex justify-end gap-2 pt-2">
          <button type="button" onclick="closeModal('createTripModal')" class="px-4 py-2 text-sm font-semibold text-slate-600">Cancel</button>
          <button type="submit" class="bg-indigo-600 text-white px-4 py-2 rounded-lg text-sm font-semibold hover:bg-indigo-700">Create</button>
        </div>
      </form>
    </div>
  </div>

  <!-- MODAL: ADD STOP / CITY -->
  <div id="addStopModal" class="fixed inset-0 bg-slate-900/40 backdrop-blur-sm hidden items-center justify-center p-4 z-50">
    <div class="bg-white rounded-2xl max-w-md w-full p-6 shadow-xl">
      <h3 class="text-xl font-bold text-slate-800 mb-4">Add Destination Stop</h3>
      <form onsubmit="handleAddStop(event)" class="space-y-4">
        <div>
          <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">City Name</label>
          <input id="stopCity" required placeholder="e.g. Paris" class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm outline-none focus:ring-2 focus:ring-indigo-500" />
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Country</label>
          <input id="stopCountry" required placeholder="e.g. France" class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm outline-none focus:ring-2 focus:ring-indigo-500" />
        </div>
        <div class="flex justify-end gap-2 pt-2">
          <button type="button" onclick="closeModal('addStopModal')" class="px-4 py-2 text-sm font-semibold text-slate-600">Cancel</button>
          <button type="submit" class="bg-indigo-600 text-white px-4 py-2 rounded-lg text-sm font-semibold hover:bg-indigo-700">Add Stop</button>
        </div>
      </form>
    </div>
  </div>

  <!-- MODAL: ADD ACTIVITY -->
  <div id="addActivityModal" class="fixed inset-0 bg-slate-900/40 backdrop-blur-sm hidden items-center justify-center p-4 z-50">
    <div class="bg-white rounded-2xl max-w-md w-full p-6 shadow-xl">
      <h3 class="text-xl font-bold text-slate-800 mb-4">Add Activity</h3>
      <form onsubmit="handleAddActivity(event)" class="space-y-4">
        <input type="hidden" id="targetStopIndex" />
        <div>
          <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Activity Name</label>
          <input id="actName" required placeholder="e.g. Louvre Museum Visit" class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm outline-none focus:ring-2 focus:ring-indigo-500" />
        </div>
        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Category</label>
            <select id="actCategory" class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm outline-none">
              <option value="Sightseeing">Sightseeing</option>
              <option value="Food">Food</option>
              <option value="Stay">Stay</option>
              <option value="Transport">Transport</option>
            </select>
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Estimated Cost ($)</label>
            <input type="number" step="0.01" id="actCost" required placeholder="25.00" class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm outline-none" />
          </div>
        </div>
        <div class="flex justify-end gap-2 pt-2">
          <button type="button" onclick="closeModal('addActivityModal')" class="px-4 py-2 text-sm font-semibold text-slate-600">Cancel</button>
          <button type="submit" class="bg-indigo-600 text-white px-4 py-2 rounded-lg text-sm font-semibold hover:bg-indigo-700">Add</button>
        </div>
      </form>
    </div>
  </div>

  <script>
    // Initial Seed Data
    let trips = JSON.parse(localStorage.getItem('gt_trips')) || [
      {
        id: 1,
        title: "European Getaway",
        start: "2026-09-10",
        end: "2026-09-18",
        desc: "Exploring history, architecture, and food across France and Italy.",
        image: "https://images.unsplash.com/photo-1502602898657-3e91760cbb34?w=800",
        stops: [
          {
            city: "Paris",
            country: "France",
            activities: [
              { name: "Eiffel Tower Visit", category: "Sightseeing", cost: 35 },
              { name: "Seine River Dinner", category: "Food", cost: 80 }
            ]
          },
          {
            city: "Rome",
            country: "Italy",
            activities: [
              { name: "Colosseum Tour", category: "Sightseeing", cost: 30 },
              { name: "Pasta Cooking Class", category: "Food", cost: 65 }
            ]
          }
        ]
      }
    ];

    let activeTripIndex = 0;
    let chartInstance = null;

    function saveAndRender() {
      localStorage.setItem('gt_trips', JSON.stringify(trips));
      renderTrips();
    }

    function switchView(view) {
      document.getElementById('dashboardView').classList.toggle('hidden', view !== 'dashboard');
      document.getElementById('tripDetailView').classList.toggle('hidden', view !== 'detail');
      if (view === 'detail') renderTripDetail();
    }

    function openModal(id) { document.getElementById(id).classList.remove('hidden'); document.getElementById(id).classList.add('flex'); }
    function closeModal(id) { document.getElementById(id).classList.add('hidden'); document.getElementById(id).classList.remove('flex'); }

    function renderTrips() {
      const grid = document.getElementById('tripsGrid');
      grid.innerHTML = trips.map((trip, idx) => `
        <div onclick="selectTrip(${idx})" class="cursor-pointer bg-white rounded-2xl border border-slate-200 overflow-hidden shadow-sm hover:shadow-md transition">
          <div class="h-40 bg-slate-800 relative">
            <img src="${trip.image || 'https://images.unsplash.com/photo-1488646953014-85cb44e25828?w=800'}" class="w-full h-full object-cover opacity-70" />
            <div class="absolute bottom-3 left-4 text-white">
              <span class="text-xs bg-indigo-600 px-2 py-0.5 rounded font-semibold">${trip.stops.length} Stops</span>
              <h3 class="font-bold text-lg leading-tight mt-1">${trip.title}</h3>
            </div>
          </div>
          <div class="p-4 flex justify-between items-center text-xs text-slate-500">
            <span>📅 ${trip.start} to ${trip.end}</span>
            <span class="font-bold text-indigo-600 text-sm">$${calculateTripTotal(trip)}</span>
          </div>
        </div>
      `).join('');
    }

    function calculateTripTotal(trip) {
      return trip.stops.reduce((acc, stop) => 
        acc + stop.activities.reduce((sAcc, act) => sAcc + Number(act.cost), 0), 0
      ).toFixed(2);
    }

    function selectTrip(idx) {
      activeTripIndex = idx;
      switchView('detail');
    }

    function renderTripDetail() {
      const trip = trips[activeTripIndex];
      document.getElementById('activeTripTitle').innerText = trip.title;
      document.getElementById('activeTripDates').innerText = `${trip.start} to ${trip.end}`;
      document.getElementById('activeTripDesc').innerText = trip.desc || '';
      document.getElementById('totalCostDisplay').innerText = `$${calculateTripTotal(trip)}`;

      const stopsContainer = document.getElementById('stopsContainer');
      stopsContainer.innerHTML = trip.stops.map((stop, sIdx) => `
        <div class="bg-white rounded-2xl border border-slate-200 overflow-hidden shadow-sm">
          <div class="bg-slate-900 text-white p-4 flex justify-between items-center">
            <div>
              <span class="text-xs text-indigo-400 font-bold uppercase">Stop ${sIdx + 1}</span>
              <h3 class="text-xl font-bold">${stop.city}, ${stop.country}</h3>
            </div>
            <button onclick="prepareAddActivity(${sIdx})" class="text-xs bg-indigo-600 hover:bg-indigo-700 px-3 py-1.5 rounded-lg font-medium">+ Add Activity</button>
          </div>
          <div class="p-4 divide-y divide-slate-100">
            ${stop.activities.length === 0 ? '<p class="text-xs text-slate-400 italic">No activities planned.</p>' : ''}
            ${stop.activities.map(act => `
              <div class="py-2.5 flex justify-between items-center">
                <div>
                  <p class="text-sm font-semibold text-slate-800">${act.name}</p>
                  <span class="text-[10px] px-2 py-0.5 rounded font-semibold bg-slate-100 text-slate-600">${act.category}</span>
                </div>
                <span class="text-sm font-bold text-slate-900">$${Number(act.cost).toFixed(2)}</span>
              </div>
            `).join('')}
          </div>
        </div>
      `).join('');

      renderChart(trip);
    }

    function renderChart(trip) {
      const totals = { Sightseeing: 0, Food: 0, Stay: 0, Transport: 0 };
      trip.stops.forEach(s => s.activities.forEach(a => {
        totals[a.category] = (totals[a.category] || 0) + Number(a.cost);
      }));

      const ctx = document.getElementById('budgetChart').getContext('2d');
      if (chartInstance) chartInstance.destroy();
      chartInstance = new Chart(ctx, {
        type: 'doughnut',
        data: {
          labels: Object.keys(totals),
          datasets: [{
            data: Object.values(totals),
            backgroundColor: ['#F59E0B', '#EF4444', '#10B981', '#3B82F6']
          }]
        },
        options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { position: 'bottom' } } }
      });
    }

    function handleCreateTrip(e) {
      e.preventDefault();
      trips.push({
        id: Date.now(),
        title: document.getElementById('newTripName').value,
        start: document.getElementById('newTripStart').value,
        end: document.getElementById('newTripEnd').value,
        image: document.getElementById('newTripImage').value,
        stops: []
      });
      closeModal('createTripModal');
      e.target.reset();
      saveAndRender();
    }

    function handleAddStop(e) {
      e.preventDefault();
      trips[activeTripIndex].stops.push({
        city: document.getElementById('stopCity').value,
        country: document.getElementById('stopCountry').value,
        activities: []
      });
      closeModal('addStopModal');
      e.target.reset();
      saveAndRender();
      renderTripDetail();
    }

    function prepareAddActivity(stopIdx) {
      document.getElementById('targetStopIndex').value = stopIdx;
      openModal('addActivityModal');
    }

    function handleAddActivity(e) {
      e.preventDefault();
      const sIdx = document.getElementById('targetStopIndex').value;
      trips[activeTripIndex].stops[sIdx].activities.push({
        name: document.getElementById('actName').value,
        category: document.getElementById('actCategory').value,
        cost: Number(document.getElementById('actCost').value)
      });
      closeModal('addActivityModal');
      e.target.reset();
      saveAndRender();
      renderTripDetail();
    }

    // Initialize
    saveAndRender();
  </script>
</body>
</html>
